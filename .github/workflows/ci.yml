name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every module
        run: |
          find src scripts test -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Unit + HTTP integration tests (offline, no API key needed)
        run: npm test
      - name: MCP stdio probe (offline, mock mode)
        run: npm run test:mcp
